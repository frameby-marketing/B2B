<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>B2B 영업 메일 대시보드</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
:root{
  --bg:#f5f6f8; --surface:#ffffff; --surface-2:#f0f2f5; --border:#e3e6eb;
  --text:#14171c; --text-2:#5b6370; --text-3:#8a919c;
  --accent:#2f6bff; --accent-soft:#e8efff;
  --sent:#2f6bff; --reply:#12a37a; --sample:#f08a24; --hold:#d64545; --wait:#b7bdc7;
  --reply-soft:#e3f6ef; --sample-soft:#fdf0e3; --hold-soft:#fbe9e9; --wait-soft:#eef0f3;
  --shadow:0 1px 2px rgba(16,24,40,.04),0 1px 3px rgba(16,24,40,.06);
}
:root[data-theme="dark"]{
  --bg:#0e1116; --surface:#161a21; --surface-2:#1d222b; --border:#272d38;
  --text:#e8ebf0; --text-2:#a3abb8; --text-3:#6f7886;
  --accent:#5b8cff; --accent-soft:#1c2740;
  --sent:#5b8cff; --reply:#2fc394; --sample:#f5a04f; --hold:#ef6b6b; --wait:#4a515d;
  --reply-soft:#14302a; --sample-soft:#35261a; --hold-soft:#3a1d1f; --wait-soft:#222831;
  --shadow:none;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font-family:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;transition:background .2s,color .2s}
.wrap{max-width:1280px;margin:0 auto;padding:24px 24px 64px}
header{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:24px}
h1{font-size:22px;font-weight:700;margin:0;letter-spacing:-.02em}
.sub{color:var(--text-2);margin-top:4px;font-size:13px}
.sub b{color:var(--text);font-weight:600}
.actions{display:flex;gap:8px;align-items:center}
.btn{display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 14px;border-radius:9px;border:1px solid var(--border);background:var(--surface);color:var(--text);font:inherit;font-size:13px;font-weight:600;cursor:pointer;text-decoration:none;box-shadow:var(--shadow);transition:background .15s,border-color .15s}
.btn:hover{background:var(--surface-2)}
.btn svg{width:16px;height:16px;flex:none}
.btn.icon{width:36px;padding:0;justify-content:center}
.btn.spinning svg{animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.updated{color:var(--text-3);font-size:12px;margin-right:4px;white-space:nowrap}

.card{background:var(--surface);border:1px solid var(--border);border-radius:14px;box-shadow:var(--shadow);padding:20px}
.card h2{font-size:15px;font-weight:700;margin:0 0 4px;letter-spacing:-.01em}
.card .desc{color:var(--text-3);font-size:12px;margin:0 0 16px}

.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}
.kpi{padding:18px 20px}
.kpi .label{display:flex;align-items:center;gap:6px;color:var(--text-2);font-size:13px;font-weight:600}
.kpi .dot{width:8px;height:8px;border-radius:50%}
.kpi .val{font-size:30px;font-weight:700;letter-spacing:-.03em;margin-top:6px;font-variant-numeric:tabular-nums}
.kpi .val small{font-size:15px;color:var(--text-3);font-weight:600;margin-left:2px}
.kpi .meta{color:var(--text-3);font-size:12px;margin-top:2px}
.kpi .meta b{color:var(--text-2)}
.bar{height:6px;border-radius:99px;background:var(--surface-2);overflow:hidden;margin-top:12px}
.bar>i{display:block;height:100%;border-radius:99px;transition:width .6s ease}

.grid2{display:grid;grid-template-columns:1.25fr 1fr;gap:16px;margin-bottom:16px}

/* funnel */
.funnel{display:flex;flex-direction:column;gap:10px}
.frow{display:grid;grid-template-columns:96px 1fr 92px;align-items:center;gap:12px}
.frow .fl{font-size:13px;font-weight:600;color:var(--text-2)}
.ftrack{height:30px;background:var(--surface-2);border-radius:8px;overflow:hidden}
.ftrack>i{display:flex;align-items:center;height:100%;border-radius:8px;padding-left:10px;color:#fff;font-weight:700;font-size:13px;transition:width .6s ease;min-width:2px}
.frow .fv{text-align:right;font-variant-numeric:tabular-nums;font-size:13px;color:var(--text-2)}
.frow .fv b{color:var(--text);font-size:15px}

/* owners */
.owners{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.owner{border:1px solid var(--border);border-radius:12px;padding:16px;background:var(--surface)}
.owner .on{font-weight:700;font-size:15px;display:flex;justify-content:space-between;align-items:baseline}
.owner .on span{font-size:12px;color:var(--text-3);font-weight:500}
.ostat{display:flex;justify-content:space-between;margin-top:12px;font-size:13px;color:var(--text-2)}
.ostat b{color:var(--text);font-variant-numeric:tabular-nums}
.stack{display:flex;height:10px;border-radius:99px;overflow:hidden;background:var(--surface-2);margin-top:6px}
.stack i{display:block;height:100%;transition:width .6s ease}
.legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:14px;color:var(--text-2);font-size:12px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}

/* weeks */
.weeks{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.week{border:1px solid var(--border);border-radius:12px;padding:16px;position:relative}
.week.current{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.week .wt{display:flex;justify-content:space-between;align-items:center;font-weight:700;font-size:15px}
.tag{display:inline-flex;align-items:center;height:22px;padding:0 8px;border-radius:6px;font-size:11px;font-weight:700}
.tag.done{background:var(--reply-soft);color:var(--reply)}
.tag.now{background:var(--accent-soft);color:var(--accent)}
.tag.next{background:var(--wait-soft);color:var(--text-3)}
.week .wsub{color:var(--text-3);font-size:12px;margin-top:2px}
.wnums{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.wnums div{background:var(--surface-2);border-radius:8px;padding:8px 10px}
.wnums .k{font-size:11px;color:var(--text-3);font-weight:600}
.wnums .v{font-size:18px;font-weight:700;font-variant-numeric:tabular-nums}
.wnums .v small{font-size:12px;color:var(--text-3);font-weight:600}
.wsplit{margin-top:10px;font-size:12px;color:var(--text-2);display:flex;justify-content:space-between}

/* highlights */
.hl{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.hitem{border:1px solid var(--border);border-radius:12px;padding:14px 16px;background:var(--surface)}
.hitem .ht{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.hitem .hn{font-weight:700}
.hitem .hm{color:var(--text-3);font-size:12px;margin-top:2px}
.hitem .note{margin-top:10px;font-size:12.5px;color:var(--text-2);white-space:pre-wrap;background:var(--surface-2);border-radius:8px;padding:8px 10px;max-height:120px;overflow:auto}
.empty{color:var(--text-3);font-size:13px;padding:12px 0}

/* table */
.tools{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;align-items:center}
.seg{display:inline-flex;background:var(--surface-2);border-radius:9px;padding:3px}
.seg button{border:0;background:transparent;color:var(--text-2);font:inherit;font-size:12.5px;font-weight:600;height:28px;padding:0 10px;border-radius:7px;cursor:pointer}
.seg button.on{background:var(--surface);color:var(--text);box-shadow:var(--shadow)}
:root[data-theme="dark"] .seg button.on{background:var(--border)}
.search{flex:1;min-width:180px;height:34px;border:1px solid var(--border);border-radius:9px;background:var(--surface);color:var(--text);padding:0 12px;font:inherit;font-size:13px}
.search:focus{outline:2px solid var(--accent-soft);border-color:var(--accent)}
.tablewrap{overflow-x:auto;border:1px solid var(--border);border-radius:12px}
table{width:100%;border-collapse:collapse;font-size:13px;min-width:860px}
th,td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--border);vertical-align:top}
th,td:nth-child(2),td:nth-child(3){white-space:nowrap}
th{background:var(--surface-2);color:var(--text-2);font-weight:600;font-size:12px;position:sticky;top:0}
tr:last-child td{border-bottom:0}
tbody tr:hover td{background:var(--surface-2)}
td.no{color:var(--text-3);font-variant-numeric:tabular-nums;width:44px}
td.name{font-weight:600}
td.contact{color:var(--text-2);font-size:12px;max-width:260px;word-break:break-all}
td.memo{color:var(--text-2);font-size:12px;max-width:280px;white-space:pre-wrap}
.pill{display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 8px;border-radius:99px;font-size:11.5px;font-weight:700;white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.p-sent{background:var(--accent-soft);color:var(--sent)}
.p-reply{background:var(--reply-soft);color:var(--reply)}
.p-sample{background:var(--sample-soft);color:var(--sample)}
.p-hold{background:var(--hold-soft);color:var(--hold)}
.p-wait{background:var(--wait-soft);color:var(--text-3)}
.count{color:var(--text-3);font-size:12px;margin-left:auto}

.section{margin-bottom:16px}
.err{background:var(--hold-soft);color:var(--hold);border-radius:12px;padding:14px 16px;margin-bottom:16px;font-size:13px;display:none}
.skeleton{opacity:.45}

@media (max-width:1000px){
  .kpis{grid-template-columns:repeat(2,1fr)}
  .grid2{grid-template-columns:1fr}
  .weeks{grid-template-columns:1fr}
}
@media (max-width:560px){
  .wrap{padding:16px 16px 48px}
  .kpis{grid-template-columns:1fr 1fr;gap:8px}
  .kpi{padding:14px}
  .kpi .val{font-size:24px}
  .owners{grid-template-columns:1fr}
  .frow{grid-template-columns:72px 1fr 76px;gap:8px}
  .btn .t{display:none}
  .btn{padding:0 10px}
  .updated{display:none}
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>B2B 영업 메일 진행 현황</h1>
      <div class="sub" id="sub">팀장 48 · 과장 48 · 총 96개 업체 · 데이터 불러오는 중…</div>
    </div>
    <div class="actions">
      <span class="updated" id="updated"></span>
      <button class="btn" id="refresh" title="새로고침">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg>
        <span class="t">새로고침</span>
      </button>
      <a class="btn" id="sheetLink" target="_blank" rel="noopener" title="스프레드시트 열기">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M3 15h18M9 3v18"/></svg>
        <span class="t">스프레드시트</span>
      </a>
      <button class="btn icon" id="theme" title="라이트/다크 전환" aria-label="라이트/다크 전환"></button>
    </div>
  </header>

  <div class="err" id="err"></div>

  <div class="kpis" id="kpis"></div>

  <div class="grid2">
    <div class="card">
      <h2>목표 퍼널</h2>
      <p class="desc">발송 → 1차 목표(회신 확보) → 2차 목표(샘플 출고)</p>
      <div class="funnel" id="funnel"></div>
    </div>
    <div class="card">
      <h2>담당자별 현황</h2>
      <p class="desc">각 48개 업체 기준</p>
      <div class="owners" id="owners"></div>
      <div class="legend">
        <span><i style="background:var(--sample)"></i>샘플 출고</span>
        <span><i style="background:var(--reply)"></i>회신 (샘플 전)</span>
        <span><i style="background:var(--sent)"></i>발송·회신대기</span>
        <span><i style="background:var(--hold)"></i>발송보류</span>
        <span><i style="background:var(--wait)"></i>미발송</span>
      </div>
    </div>
  </div>

  <div class="card section">
    <h2>주차별 발송 계획</h2>
    <p class="desc">담당자별 11월 2주차 15곳 · 3주차 15곳 · 4주차 18곳</p>
    <div class="weeks" id="weeks"></div>
  </div>

  <div class="card section">
    <h2>회신 · 특이사항</h2>
    <p class="desc">회신받은 업체와 비고가 있는 업체</p>
    <div class="hl" id="highlights"></div>
  </div>

  <div class="card section">
    <h2>전체 업체 리스트</h2>
    <p class="desc">컨택리스트 (최종) 시트 원본</p>
    <div class="tools">
      <div class="seg" data-key="owner">
        <button data-v="all" class="on">전체</button><button data-v="팀장">팀장</button><button data-v="과장">과장</button>
      </div>
      <div class="seg" data-key="week">
        <button data-v="all" class="on">전 주차</button><button data-v="2">2주차</button><button data-v="3">3주차</button><button data-v="4">4주차</button>
      </div>
      <div class="seg" data-key="stage">
        <button data-v="all" class="on">전체 단계</button><button data-v="waitReply">회신대기</button><button data-v="reply">회신완료</button><button data-v="sample">샘플출고</button><button data-v="hold">보류</button><button data-v="unsent">미발송</button>
      </div>
      <input class="search" id="q" placeholder="업체명 · 연락처 · 비고 검색">
    </div>
    <div class="tablewrap">
      <table>
        <thead><tr><th>NO</th><th>담당</th><th>주차</th><th>업체명</th><th>컨택 채널</th><th>발송상태</th><th>회신여부</th><th>샘플 출고</th><th>비고</th></tr></thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>
    <div class="tools" style="margin-top:10px;margin-bottom:0"><span class="count" id="count"></span></div>
  </div>
</div>

<script>
/* ===== 설정 ===== */
const SHEET_ID   = "1ZvhJ6YEQBDPZAtrN29_6zygsRHdQ_4bAQI30bcValeI";
const SHEET_GID  = "886433112";
const SHEET_NAME = "컨택리스트 (최종)";
const RANGE      = "A1:G105";
const OWNERS     = ["팀장", "과장"];
const PER_OWNER  = 48;
// 주차 구간 (NO 기준): 1~15 → 2주차, 16~30 → 3주차, 31~48 → 4주차
const WEEKS = [
  { w: 2, label: "11월 2주차", from: 1,  to: 15 },
  { w: 3, label: "11월 3주차", from: 16, to: 30 },
  { w: 4, label: "11월 4주차", from: 31, to: 48 },
];
const AUTO_REFRESH_MIN = 5;

const SHEET_URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/edit#gid=${SHEET_GID}`;
const CSV_URL = () =>
  `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&headers=0` +
  `&sheet=${encodeURIComponent(SHEET_NAME)}&range=${RANGE}&_=${Date.now()}`;

document.getElementById("sheetLink").href = SHEET_URL;

/* ===== 테마 ===== */
const ICON_SUN  = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>';
const ICON_MOON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>';
function getStored(){ try { return localStorage.getItem("dash-theme"); } catch(e){ return null; } }
function setTheme(t){
  document.documentElement.setAttribute("data-theme", t);
  document.getElementById("theme").innerHTML = t === "dark" ? ICON_SUN : ICON_MOON;
  try { localStorage.setItem("dash-theme", t); } catch(e){}
}
setTheme(getStored() || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light"));
document.getElementById("theme").onclick = () =>
  setTheme(document.documentElement.getAttribute("data-theme") === "dark" ? "light" : "dark");

/* ===== CSV 파서 (따옴표 · 줄바꿈 지원) ===== */
function parseCSV(text){
  const rows = []; let row = [], cur = "", q = false;
  for (let i = 0; i < text.length; i++){
    const c = text[i];
    if (q){
      if (c === '"'){ if (text[i+1] === '"'){ cur += '"'; i++; } else q = false; }
      else cur += c;
    } else if (c === '"') q = true;
    else if (c === ","){ row.push(cur); cur = ""; }
    else if (c === "\n"){ row.push(cur); rows.push(row); row = []; cur = ""; }
    else if (c !== "\r") cur += c;
  }
  if (cur !== "" || row.length){ row.push(cur); rows.push(row); }
  return rows;
}

/* ===== 데이터 정리 ===== */
function weekOf(no){ const w = WEEKS.find(x => no >= x.from && no <= x.to); return w ? w.w : null; }
function stageOf(r){
  if (r.send.includes("보류")) return "hold";
  if (r.sample.includes("출고완료")) return "sample";
  if (r.reply.includes("회신완료")) return "reply";
  if (r.send.includes("발송완료")) return "waitReply";
  return "unsent";
}
function buildRows(csv){
  const out = [];
  let block = -1, idx = 0;
  for (const c of csv){
    const cells = c.map(s => (s || "").trim());
    const joined = cells.join("");
    if (!joined) continue;
    // 블록 제목 행 ("팀장 48개" / "과장 48개")
    const ownerTitle = OWNERS.findIndex(o => cells[0].startsWith(o) && !cells[1]);
    if (ownerTitle >= 0){ block = ownerTitle; idx = 0; continue; }
    // 헤더 행 → 새 블록 시작
    if (cells[1] === "업체명"){
      if (block < 0 || idx > 0) block = Math.min(block + 1, OWNERS.length - 1);
      idx = 0; continue;
    }
    if (block < 0 || !cells[1]) continue;
    idx++;
    const no = parseInt(cells[0], 10) || idx;
    const r = {
      owner: OWNERS[block], no, week: weekOf(no),
      name: cells[1], contact: cells[2] || "", send: cells[3] || "",
      reply: cells[4] || "", sample: cells[5] || "", memo: cells[6] || "",
    };
    r.stage = stageOf(r);
    out.push(r);
  }
  return out;
}

/* ===== 렌더링 ===== */
const $ = id => document.getElementById(id);
const pct = (a, b) => b ? Math.round(a / b * 1000) / 10 : 0;
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function stats(rows){
  const s = { total: rows.length, sent: 0, hold: 0, unsent: 0, reply: 0, sample: 0, waitReply: 0 };
  rows.forEach(r => {
    if (r.stage === "hold") s.hold++;
    else if (r.stage === "unsent") s.unsent++;
    else { s.sent++; if (r.stage === "waitReply") s.waitReply++; else s.reply++; if (r.stage === "sample") s.sample++; }
  });
  return s;
}
function pill(text, kind){ return text ? `<span class="pill p-${kind}">${esc(text)}</span>` : '<span style="color:var(--text-3)">–</span>'; }
function sendKind(t){ return t.includes("완료") ? "sent" : t.includes("보류") ? "hold" : "wait"; }
function replyKind(t){ return t.includes("완료") ? "reply" : t.includes("불가") ? "hold" : "wait"; }
function sampleKind(t){ return t.includes("완료") ? "sample" : "wait"; }

let ROWS = [];
const filt = { owner: "all", week: "all", stage: "all", q: "" };

function render(){
  const rows = ROWS, S = stats(rows);
  const target = OWNERS.length * PER_OWNER;
  const curWeek = WEEKS.find(w => rows.some(r => r.week === w.w && r.stage === "unsent"));

  $("sub").innerHTML = `팀장 ${PER_OWNER} · 과장 ${PER_OWNER} · 총 <b>${target}</b>개 업체 · ` +
    (curWeek ? `다음 발송 <b>${curWeek.label}</b>` : "<b>전 주차 발송 완료</b>");

  const kpi = (label, color, val, unit, meta, ratio) => `
    <div class="card kpi"><div class="label"><span class="dot" style="background:${color}"></span>${label}</div>
    <div class="val">${val}<small>${unit}</small></div><div class="meta">${meta}</div>
    <div class="bar"><i style="width:${Math.min(ratio,100)}%;background:${color}"></i></div></div>`;
  $("kpis").innerHTML =
    kpi("발송 완료", "var(--sent)", S.sent, `/ ${target}`, `진행률 <b>${pct(S.sent, target)}%</b> · 보류 ${S.hold} · 미발송 ${S.unsent}`, pct(S.sent, target)) +
    kpi("회신 확보 (1차 목표)", "var(--reply)", S.reply, "곳", `발송 대비 회신률 <b>${pct(S.reply, S.sent)}%</b>`, pct(S.reply, S.sent)) +
    kpi("샘플 출고 (2차 목표)", "var(--sample)", S.sample, "곳", `회신 대비 전환율 <b>${pct(S.sample, S.reply)}%</b>`, pct(S.sample, S.reply)) +
    kpi("회신 대기중", "var(--wait)", S.waitReply, "곳", `팔로업 필요 · 발송의 <b>${pct(S.waitReply, S.sent)}%</b>`, pct(S.waitReply, S.sent));

  const fr = (label, n, base, color, sub) => `
    <div class="frow"><div class="fl">${label}</div>
    <div class="ftrack"><i style="width:${base ? Math.max(n / base * 100, n ? 6 : 0) : 0}%;background:${color}">${base && n / base >= 0.12 ? n : ""}</i></div>
    <div class="fv"><b>${n}</b> · ${sub}</div></div>`;
  $("funnel").innerHTML =
    fr("전체 대상", target, target, "var(--wait)", "100%") +
    fr("발송 완료", S.sent, target, "var(--sent)", `${pct(S.sent, target)}%`) +
    fr("회신 확보", S.reply, target, "var(--reply)", `${pct(S.reply, S.sent)}%`) +
    fr("샘플 출고", S.sample, target, "var(--sample)", `${pct(S.sample, S.reply)}%`);

  $("owners").innerHTML = OWNERS.map(o => {
    const os = stats(rows.filter(r => r.owner === o)), T = PER_OWNER;
    const seg = (n, c) => `<i style="width:${n / T * 100}%;background:${c}"></i>`;
    return `<div class="owner"><div class="on">${o}<span>${os.total}개 등록</span></div>
      <div class="stack">${seg(os.sample,"var(--sample)")}${seg(os.reply - os.sample,"var(--reply)")}${seg(os.waitReply,"var(--sent)")}${seg(os.hold,"var(--hold)")}${seg(os.unsent,"var(--wait)")}</div>
      <div class="ostat"><span>발송</span><b>${os.sent} / ${T}</b></div>
      <div class="ostat"><span>회신</span><b>${os.reply} <span style="color:var(--text-3);font-weight:500">(${pct(os.reply, os.sent)}%)</span></b></div>
      <div class="ostat"><span>샘플 출고</span><b>${os.sample}</b></div>
      <div class="ostat"><span>보류</span><b>${os.hold}</b></div></div>`;
  }).join("");

  $("weeks").innerHTML = WEEKS.map(w => {
    const wr = rows.filter(r => r.week === w.w), ws = stats(wr);
    const planned = (w.to - w.from + 1) * OWNERS.length;
    const done = ws.unsent === 0 && wr.length > 0;
    const isCur = curWeek && curWeek.w === w.w;
    const tag = done ? '<span class="tag done">발송 완료</span>' : isCur ? '<span class="tag now">진행 예정</span>' : '<span class="tag next">대기</span>';
    const per = OWNERS.map(o => { const s = stats(wr.filter(r => r.owner === o)); return `${o} ${s.sent}/${w.to - w.from + 1}`; }).join(" · ");
    return `<div class="week ${isCur ? "current" : ""}"><div class="wt">${w.label}${tag}</div>
      <div class="wsub">NO ${w.from}–${w.to} · 계획 ${planned}곳</div>
      <div class="wnums">
        <div><div class="k">발송</div><div class="v">${ws.sent}<small>/${planned}</small></div></div>
        <div><div class="k">회신</div><div class="v" style="color:var(--reply)">${ws.reply}</div></div>
        <div><div class="k">샘플</div><div class="v" style="color:var(--sample)">${ws.sample}</div></div>
      </div>
      <div class="wsplit"><span>${per}</span><span>${ws.hold ? `보류 ${ws.hold}` : ""}</span></div></div>`;
  }).join("");

  const hl = rows.filter(r => r.stage === "reply" || r.stage === "sample" || r.stage === "hold" || r.memo)
    .sort((a, b) => ({ sample: 0, reply: 1, hold: 2 }[a.stage] ?? 3) - ({ sample: 0, reply: 1, hold: 2 }[b.stage] ?? 3));
  $("highlights").innerHTML = hl.length ? hl.map(r => {
    const p = r.stage === "sample" ? pill("샘플 출고완료", "sample") : r.stage === "reply" ? pill("회신완료", "reply") : r.stage === "hold" ? pill(r.send, "hold") : pill(r.reply || r.send, "wait");
    return `<div class="hitem"><div class="ht"><div><div class="hn">${esc(r.name)}</div>
      <div class="hm">${r.owner} · NO ${r.no} · ${r.week ? r.week + "주차" : ""}</div></div>${p}</div>
      ${r.memo ? `<div class="note">${esc(r.memo)}</div>` : ""}</div>`;
  }).join("") : '<div class="empty">아직 회신이나 특이사항이 없습니다.</div>';

  renderTable();
}

function renderTable(){
  const q = filt.q.toLowerCase();
  const list = ROWS.filter(r =>
    (filt.owner === "all" || r.owner === filt.owner) &&
    (filt.week === "all" || String(r.week) === filt.week) &&
    (filt.stage === "all" || r.stage === filt.stage) &&
    (!q || (r.name + r.contact + r.memo).toLowerCase().includes(q)));
  $("tbody").innerHTML = list.map(r => `<tr>
    <td class="no">${r.no}</td><td>${r.owner}</td><td>${r.week ? r.week + "주차" : "–"}</td>
    <td class="name">${esc(r.name)}</td><td class="contact">${esc(r.contact)}</td>
    <td>${pill(r.send, sendKind(r.send))}</td><td>${pill(r.reply, replyKind(r.reply))}</td>
    <td>${pill(r.sample, sampleKind(r.sample))}</td><td class="memo">${esc(r.memo)}</td></tr>`).join("")
    || '<tr><td colspan="9" class="empty" style="text-align:center">조건에 맞는 업체가 없습니다.</td></tr>';
  $("count").textContent = `${list.length} / ${ROWS.length}개 표시`;
}

document.querySelectorAll(".seg").forEach(seg => seg.addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  seg.querySelectorAll("button").forEach(x => x.classList.toggle("on", x === b));
  filt[seg.dataset.key] = b.dataset.v; renderTable();
}));
$("q").addEventListener("input", e => { filt.q = e.target.value; renderTable(); });

/* ===== 불러오기 ===== */
async function load(){
  const btn = $("refresh"); btn.classList.add("spinning"); btn.disabled = true;
  try {
    const res = await fetch(CSV_URL(), { cache: "no-store" });
    if (!res.ok) throw new Error("HTTP " + res.status);
    const text = await res.text();
    if (text.trim().startsWith("<")) throw new Error("시트를 CSV로 읽지 못했습니다 (공유 설정 확인)");
    const rows = buildRows(parseCSV(text));
    if (!rows.length) throw new Error("업체 데이터가 비어 있습니다");
    ROWS = rows; render();
    $("err").style.display = "none";
    $("updated").textContent = "업데이트 " + new Date().toLocaleTimeString("ko-KR", { hour: "2-digit", minute: "2-digit", second: "2-digit" });
  } catch (e) {
    $("err").style.display = "block";
    $("err").textContent = "스프레드시트를 불러오지 못했습니다: " + e.message + " — 시트가 '링크가 있는 모든 사용자 보기'로 공유돼 있는지 확인해 주세요.";
  } finally {
    btn.classList.remove("spinning"); btn.disabled = false;
  }
}
$("refresh").onclick = load;
load();
setInterval(load, AUTO_REFRESH_MIN * 60 * 1000);
</script>
</body>
</html>
